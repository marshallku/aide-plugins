# Pull requests: verify changed submissions and write a review report (Checks → Summary).
name: check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/check/go.mod
      - name: Build and test the checker
        working-directory: tools/check
        run: go test ./... && go build -o aide-plugin-check .
      - name: Check changed submissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          # Submissions and packages are append-only: only new files (no renames, edits or deletions).
          if git diff --no-renames --name-status "$base" HEAD -- submissions packages revoked.json | grep -v '^A' | grep -v 'revoked.json$' | grep .; then
            echo "::error::existing submissions and packages never change; add a new version instead"; exit 1
          fi
          if git diff --no-renames --name-only "$base" HEAD -- packages | grep .; then
            echo "::error::packages/ is written by the publish workflow only"; exit 1
          fi
          git diff --no-renames --name-only --diff-filter=A "$base" HEAD -- 'submissions/*.json' > changed.txt
          python3 scripts/index.py site /tmp/site
          if [ -s changed.txt ]; then python3 scripts/index.py check "$base" $(cat changed.txt); fi
